<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support &middot; Dharm&amacr;yana Control Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9;
  --card:#ffffff;
  --border:#e7e8ec;
  --border-soft:#eef0f3;
  --text:#15181c;
  --text-dim:#6b7280;
  --text-faint:#9aa0aa;
  --accent:#e8590d;
  --accent-dark:#c2410c;
  --accent-soft:#fdece3;
  --accent-muted:#e4a57d;
  --teal:#0f3d3e;
  --green-bg:#dcfce7;
  --green-text:#15803d;
  --green-border:#86efac;
  --red-bg:#fee2e2;
  --red-text:#b91c1c;
  --red-border:#fca5a5;
  --amber-bg:#fef3c7;
  --amber-text:#92400e;
  --amber-border:#fcd34d;
  --violet-bg:#ede9fe;
  --violet-text:#6d28d9;
  --violet-border:#c4b5fd;
  --blue-bg:#dbeafe;
  --blue-text:#1d4ed8;
  --blue-border:#93c5fd;
  --slate-bg:#f1f5f9;
  --slate-text:#475569;
  --slate-border:#cbd5e1;
  --indigo-bg:#eef2ff;
  --indigo-text:#4338ca;
  --indigo-border:#a5b4fc;
  --yellow-bg:#fef9c3;
  --yellow-text:#ca8a04;
  --yellow-border:#fde047;
  --wa-bg:#e7f7ee;
  --wa-text:#0a7d3e;
  --wa-border:#b7ebcd;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.04);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
svg{width:16px;height:16px;flex-shrink:0;vertical-align:middle;stroke:currentColor;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#d8dade;border-radius:8px;}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:264px;flex:0 0 264px;background:#fff;border-right:1px solid var(--border);
  min-height:100vh;padding:22px 16px 20px;position:sticky;top:0;align-self:flex-start;
}
.logo{display:flex;align-items:center;gap:8px;padding:2px 8px 26px;}
.logo .balloon{font-size:21px;line-height:1;}
.logo .word{font-size:20px;font-weight:800;color:var(--teal);letter-spacing:.1px;}
.nav-group{margin-bottom:2px;}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:12px 12px;border-radius:10px;
  color:#20242b;font-weight:500;font-size:14px;cursor:pointer;margin-bottom:1px;
}
.nav-item:hover{background:#f5f6f8;}
.nav-item.active{background:var(--accent-dark);color:#fff;font-weight:700;}
.nav-item .ic{width:19px;height:19px;flex:0 0 19px;display:flex;align-items:center;justify-content:center;opacity:.85;}
.nav-item svg{width:19px;height:19px;stroke:currentColor;stroke-width:1.7;}
.nav-item.parent{justify-content:space-between;}
.nav-item.parent .chev{display:flex;opacity:.55;transition:transform .15s;}
.nav-item.parent .chev svg{width:14px;height:14px;stroke-width:2;}
.nav-item.parent.open .chev{transform:rotate(180deg);}
.nav-children{margin-left:19px;padding-left:12px;margin-bottom:4px;}
.nav-children .nav-item{font-size:13.5px;padding:10px 12px;color:#3f4451;}
.nav-children .nav-item .ic{width:16px;height:16px;flex:0 0 16px;opacity:.7;}
.nav-children .nav-item svg{width:16px;height:16px;stroke-width:1.7;}
.nav-children .nav-item.active{color:#fff;}
.nav-new{
  font-size:9px;font-weight:800;color:#fff;background:#1b1b1f;border-radius:5px;
  padding:1px 5px;margin-left:6px;letter-spacing:.4px;
}
.nav-divider{height:1px;background:var(--border-soft);margin:12px 4px;}
.nav-section-label{font-size:10.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.6px;padding:10px 10px 4px;}

.main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;justify-content:flex-end;padding:16px 34px 0;
}
.avatar{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;background:#fff;color:#9aa0aa;}
.page-wrap{padding:8px 34px 60px;}
.crumbs{display:flex;align-items:center;gap:7px;color:var(--text-faint);font-size:12.5px;margin-bottom:10px;flex-wrap:wrap;}
.crumbs .sep{opacity:.7;}
.crumbs a:hover{color:var(--accent);}
.crumb-link{cursor:pointer;}
.crumb-link:hover{color:var(--accent);}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
.page-title{font-size:26px;font-weight:800;margin:0 0 4px;letter-spacing:-.2px;}
.page-sub{color:var(--text-dim);font-size:13px;margin:0;max-width:640px;}
.head-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.order-title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.order-title-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

/* buttons & pills */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;white-space:nowrap;}
.btn-solid{background:var(--accent);color:#fff;}
.btn-solid:hover{background:var(--accent-dark);}
.btn-outline{background:#fff;border-color:var(--accent);color:var(--accent);}
.btn-outline:hover{background:var(--accent-soft);}
.btn-ghost{background:#fff;border-color:var(--border);color:#374151;}
.btn-ghost:hover{background:#f7f7f8;}
.btn-outline-neutral{background:#fff;border-color:var(--border);color:var(--accent-dark);}
.btn-outline-neutral:hover{background:var(--accent-soft);}
.btn-danger-outline{background:#fff;border-color:#dc2626;color:#dc2626;}
.btn-danger-outline:hover{background:#fef2f2;}
.btn-green-outline{background:#fff;border-color:#16a34a;color:#15803d;}
.btn-green-outline:hover{background:#f0fdf4;}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}
.btn-lg{padding:12px 24px;font-size:14.5px;border-radius:10px;}
.btn[disabled]{opacity:1;cursor:not-allowed;background:#eef0f3;border-color:#eef0f3;color:#9aa0aa;box-shadow:none;}
.btn[disabled]:hover{background:#eef0f3;}
.btn svg{width:14px;height:14px;stroke:currentColor;}

.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 14px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent;}
.pill-green{background:var(--green-bg);color:var(--green-text);border-color:var(--green-border);}
.pill-red{background:var(--red-bg);color:var(--red-text);border-color:var(--red-border);}
.pill-amber{background:var(--amber-bg);color:var(--amber-text);border-color:var(--amber-border);}
.pill-violet{background:var(--violet-bg);color:var(--violet-text);border-color:var(--violet-border);}
.pill-blue{background:var(--blue-bg);color:var(--blue-text);border-color:var(--blue-border);}
.pill-slate{background:var(--slate-bg);color:var(--slate-text);border-color:var(--slate-border);}
.pill-indigo{background:var(--indigo-bg);color:var(--indigo-text);border-color:var(--indigo-border);}
.pill-outline{background:#fff;border:1px solid var(--border);color:var(--text-dim);font-weight:600;}
.pill-green-stroke{background:var(--green-bg);color:var(--green-text);border:1px solid var(--green-border);}
.pill-wa{background:var(--wa-bg);color:var(--wa-text);border-color:var(--wa-border);}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

/* cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;margin-bottom:20px;}
.card h3{margin:0 0 16px;padding-bottom:14px;border-bottom:1px solid var(--border-soft);font-size:15px;font-weight:800;display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.card h3 .count{color:var(--text-faint);font-weight:600;font-size:11.5px;letter-spacing:0;text-transform:none;}
.card > p.page-sub:first-child{margin-top:-4px;}

/* tabs */
.tabbar{display:flex;gap:4px;background:#eef0f3;padding:4px;border-radius:11px;width:fit-content;margin-bottom:18px;}
.tab{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;color:#5b6270;cursor:pointer;}
.tab.active{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(16,24,40,.08);}
.tab.disabled{opacity:.45;cursor:not-allowed;}

/* filter bar */
.filterbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
.search-box{flex:1;min-width:220px;display:flex;gap:8px;}
.search-box input{flex:1;min-width:0;height:38px;padding:9px 12px;border:1px solid var(--border);border-radius:9px;font-size:13px;background:#fff;box-sizing:border-box;}
.search-box input:focus{outline:none;}
.search-box.active input{border-color:var(--accent);}
.btn-search{flex:0 0 auto;height:38px;padding:0 18px;border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--text-faint);font-weight:600;font-size:13px;cursor:pointer;}
.btn-search:hover{background:#f5f6f8;color:var(--text-dim);border-color:#c7cad0;}
.search-box.active .btn-search{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-soft);}
.search-box.active .btn-search:hover{background:#fbdcc9;}
select.chip-select{
  appearance:none;-webkit-appearance:none;-moz-appearance:none;
  border:1px solid var(--border);background:#fff;border-radius:9px;
  padding:9px 30px 9px 13px;font-size:13px;font-family:inherit;color:#20242b;font-weight:500;
  cursor:pointer;height:38px;
  background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;background-size:13px;
}
select.chip-select:hover{border-color:#c7cad0;}
select.chip-select:focus{outline:none;border-color:var(--accent);}
.filter-select-wrap{position:relative;display:inline-block;}
select.chip-select.select-active{
  border-color:var(--accent);color:var(--accent-dark);background-color:var(--accent-soft);font-weight:500;
  border-radius:11px;padding:9px 32px 9px 15px;background-image:none;
}
.select-clear-btn{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;border-radius:50%;border:none;background:transparent;padding:0;
  color:var(--accent-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.select-clear-btn:hover{background:#fbdcc9;color:var(--accent);}
.select-clear-btn svg{width:14px;height:14px;}
.filterbar .btn-ghost{height:38px;}
.btn-apply{background:#eef0f3;color:var(--accent);border:none;font-weight:700;height:38px;}
.btn-apply:hover{background:#e5e7eb;}
.filterbar-actions{display:flex;gap:10px;}
.active-filters-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 0 0;}
.filter-tag{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:11px;padding:7px 9px 7px 15px;font-size:12.5px;font-weight:500;}
.filter-tag button{border:none;background:transparent;color:var(--accent-muted);cursor:pointer;display:flex;align-items:center;padding:2px;border-radius:50%;}
.filter-tag button:hover{background:#fbdcc9;color:var(--accent);}
.filter-tag svg{width:15px;height:15px;}
.daterange-wrap{position:relative;}
.daterange-btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--text-dim);font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;}
.daterange-btn:hover{border-color:#c7cad0;}
.daterange-btn svg{width:15px;height:15px;stroke:currentColor;}
.daterange-btn.active{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-soft);font-weight:700;}
.daterange-pop{position:absolute;top:44px;left:0;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(16,24,40,.14);padding:16px;z-index:60;display:flex;flex-direction:column;gap:12px;min-width:250px;}
.daterange-pop label{display:block;font-size:11px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
.daterange-pop input[type="date"]{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;}
.daterange-pop .drp-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:2px;}
.pagination-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-top:16px;margin-top:4px;border-top:1px solid var(--border-soft);}
.pagination-info{font-size:12.5px;color:var(--text-faint);}
.pagination-controls{display:flex;align-items:center;gap:12px;}
.pagination-pagenum{font-size:12.5px;color:var(--text-dim);font-weight:600;white-space:nowrap;}
.hamburger{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#374151;flex:0 0 34px;}
.hamburger:hover{background:#f7f7f8;}
.hamburger svg{width:17px;height:17px;}
.crumbs-row{display:flex;align-items:center;gap:14px;margin-bottom:10px;}
.sidebar.collapsed{width:0;flex:0 0 0;padding:0;overflow:hidden;border-right:none;}

/* table */
table{width:100%;border-collapse:collapse;}
thead th{text-align:left;font-size:13px;text-transform:none;letter-spacing:0;color:var(--text-dim);font-weight:600;padding:14px 16px;border-bottom:1px solid #e2e2e2;background:#f9f9f9;}
tbody td{padding:14px 16px;border-bottom:1px solid var(--border-soft);font-size:13.5px;vertical-align:middle;}
table.cases-table{table-layout:fixed;}
table.cases-table th, table.cases-table td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px;padding-right:4px;}
table.cases-table th:first-child, table.cases-table td:first-child{padding-left:16px;}
table.cases-table th:last-child, table.cases-table td:last-child{padding-right:16px;}
table.cases-table th:nth-child(1), table.cases-table td:nth-child(1){width:13%;overflow:visible;text-overflow:clip;}
table.cases-table td:nth-child(1) .order-id{white-space:normal;overflow-wrap:break-word;}
table.cases-table th:nth-child(2), table.cases-table td:nth-child(2){width:9%;}
table.cases-table th:nth-child(3), table.cases-table td:nth-child(3){width:10%;overflow:visible;text-overflow:clip;}
table.cases-table th:nth-child(4), table.cases-table td:nth-child(4){width:9%;white-space:normal;overflow:visible;text-overflow:clip;}
table.cases-table th:nth-child(5), table.cases-table td:nth-child(5){width:7%;overflow:visible;text-overflow:clip;}
table.cases-table th:nth-child(6), table.cases-table td:nth-child(6){width:19%;white-space:normal;overflow:visible;text-overflow:clip;}
table.cases-table th:nth-child(7), table.cases-table td:nth-child(7){width:15%;white-space:normal;overflow:visible;text-overflow:clip;}
table.cases-table th:nth-child(8), table.cases-table td:nth-child(8){width:18%;white-space:normal;overflow:visible;text-overflow:clip;}
table.cases-table td:nth-child(1) .sub{white-space:normal;overflow-wrap:break-word;}
table.cases-table td:nth-child(2) div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
table.cases-table td:nth-child(2) .seg-badge{margin-top:4px;}
table.cases-table .owner-pill{white-space:nowrap;}
tbody tr{cursor:pointer;}
tbody tr:hover td{background:#fafafb;}
tbody tr.row-ai td{background:#f7fbfd;}
tbody tr.row-ai:hover td{background:#eef7fa;}
tbody tr.row-urgent td{background:#fef2f2;}
tbody tr.row-urgent:hover td{background:#fde8e8;}
tbody tr.row-urgent td:first-child{box-shadow:inset 4px 0 0 var(--red-text);}
tbody tr.row-urgent .sub{color:var(--text-dim);}
.order-id{font-weight:700;color:var(--text);}
.mono{font-variant-numeric:tabular-nums;}
.sub{color:var(--text-faint);font-size:11.5px;}
.next-step-text{color:var(--text-dim);font-size:12.5px;}
.empty-row td{text-align:center;color:var(--text-faint);padding:40px 0;}

/* stat cards */
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px;}
.stat-card{background:#fff;border:1px solid var(--border);border-top:4px solid var(--border);border-radius:14px;padding:16px 18px;cursor:pointer;}
.stat-card .stat-lbl{font-size:11px;font-weight:700;color:var(--text-dim);letter-spacing:.5px;text-transform:uppercase;}
.stat-card .stat-num{font-size:27px;font-weight:800;margin-top:6px;color:#20242b;}
.stat-card.tone-orange{border-top-color:var(--accent);}
.stat-card.tone-orange .stat-num{color:var(--accent);}
.stat-card.tone-red{border-top-color:var(--red-text);}
.stat-card.tone-red .stat-num{color:var(--red-text);}
.stat-card.tone-teal{border-top-color:var(--teal);}
.stat-card.tone-teal .stat-num{color:var(--teal);}
.stat-card.tone-indigo{border-top-color:var(--indigo-text);}
.stat-card.tone-indigo .stat-num{color:var(--indigo-text);}
.stat-card.tone-yellow{border-top-color:var(--yellow-text);}
.stat-card.tone-yellow .stat-num{color:var(--yellow-text);}
.stat-card.tone-blue{border-top-color:var(--blue-text);}
.stat-card.tone-blue .stat-num{color:var(--blue-text);}
.stat-card.tone-green{border-top-color:var(--green-text);}
.stat-card.tone-green .stat-num{color:var(--green-text);}

/* misc */
.kv{display:grid;grid-template-columns:130px 1fr;gap:10px 0;}
.kv .k{color:var(--text-faint);font-size:12.5px;}
.kv .v{font-weight:600;font-size:13px;}
.two-col{display:grid;grid-template-columns:1.35fr 1fr;gap:22px;align-items:start;}
@media (max-width:1050px){.two-col{grid-template-columns:1fr;}}
.toggle{width:42px;height:24px;border-radius:999px;background:#d7dade;position:relative;cursor:pointer;flex:0 0 42px;transition:background .15s;}
.toggle.on{background:var(--accent);}
.toggle.on.green{background:#16a34a;}
.toggle .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2);}
.toggle.on .knob{left:20px;}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:14px 0;border-bottom:1px solid var(--border-soft);}
.settings-row:last-child{border-bottom:none;}
.settings-row .label{font-weight:700;font-size:13.5px;margin-bottom:3px;}
.settings-row .desc{color:var(--text-dim);font-size:12.5px;max-width:480px;}
.num-input{width:90px;border:1px solid var(--border);border-radius:8px;padding:7px 6px 7px 12px;font-size:13px;font-family:inherit;text-align:left;}
textarea.notes{width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-family:inherit;font-size:13px;resize:vertical;min-height:64px;margin-top:8px;}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,18,20,.5);display:flex;align-items:flex-start;justify-content:center;padding:5vh 20px;z-index:100;overflow:auto;}
.modal-box{background:#fff;border-radius:16px;max-width:640px;width:100%;padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal-box.wide{max-width:760px;}
.modal-box h2{margin:0 0 4px;font-size:19px;font-weight:800;}
.x-btn{border:none;background:#f1f2f4;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px;color:#555;}

/* toast */
#toast-root{position:fixed;bottom:24px;left:24px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:#15181c;color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:toastin .2s ease;max-width:340px;}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ================= Support-specific components ================= */

/* segment / owner badges */
.seg-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:999px;font-size:11.5px;font-weight:700;}
.seg-whale{background:var(--amber-bg);color:var(--amber-text);}
.seg-repeat{background:var(--blue-bg);color:var(--blue-text);}
.seg-new{background:var(--slate-bg);color:var(--slate-text);}
.seg-flagged{background:var(--red-bg);color:var(--red-text);}
.owner-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;}
.owner-ai{background:var(--indigo-bg);color:var(--indigo-text);border:1px solid var(--indigo-border);}
.owner-human{background:#fff;color:#374151;border:1px solid var(--border);}
.owner-unassigned{background:#fff;color:var(--text-faint);border:1px dashed var(--border);}
.state-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 13px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;}
.state-needs_human{background:var(--red-bg);color:var(--red-text);}
.state-in_progress{background:var(--blue-bg);color:var(--blue-text);}
.state-ai_watching{background:var(--yellow-bg);color:var(--yellow-text);}
.state-waiting_on_user{background:var(--amber-bg);color:var(--amber-text);}
.state-needs_approval{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;}
.state-resolved{background:var(--green-bg);color:var(--green-text);}
.rule-chip{display:inline-flex;align-items:center;vertical-align:middle;gap:5px;font-size:11px;font-weight:700;color:var(--accent-dark);background:var(--accent-soft);border:none;border-radius:999px;padding:3px 11px;cursor:pointer;}
.rule-chip:hover{background:#fbdcc9;}
.rule-chip-sm{font-size:10px;font-weight:800;padding:2px 8px;letter-spacing:.2px;position:relative;}
.rule-chip-sm:hover::after{
  content:attr(data-tooltip);
  position:absolute;
  top:calc(100% + 9px);
  left:0;
  background:#fff;
  color:var(--text);
  font-size:12px;
  font-weight:600;
  line-height:1.4;
  padding:8px 12px;
  border-radius:8px;
  border:1px solid var(--border);
  white-space:nowrap;
  max-width:min(260px, 70vw);
  box-shadow:0 10px 28px rgba(16,24,40,.16);
  z-index:80;
  pointer-events:none;
}
.rule-chip-sm:hover::before{
  content:'';
  position:absolute;
  top:100%;
  left:14px;
  margin-top:2px;
  border:6px solid transparent;
  border-bottom-color:#fff;
  z-index:81;
  pointer-events:none;
}

/* case detail layout — chat fixed on the right, single flat column on the left */
.case-top-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:16px;margin-bottom:18px;border-bottom:1px solid var(--border);}
.case-top-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.case-top-left h1{font-size:19px;font-weight:800;margin:0;}
.case-top-actions{display:flex;gap:10px;flex-wrap:wrap;}
.case-detail-shell{display:flex;gap:26px;align-items:flex-start;}
.case-left{flex:1;min-width:0;}
.case-chat-col{width:380px;flex:0 0 380px;position:sticky;top:14px;align-self:flex-start;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 28px);}
.case-chat-actions{display:flex;gap:10px;flex-wrap:wrap;flex:0 0 auto;}
.case-assign-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex:0 0 auto;}
.case-assign-label{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--text-faint);margin-bottom:5px;}
.detail-section{padding:18px 0;border-bottom:1px solid var(--border-soft);}
.detail-section:first-child{padding-top:0;}
.detail-section:last-child{border-bottom:none;padding-bottom:0;}
.detail-section h4{margin:0 0 12px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--text-faint);}
.action-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.approval-card{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:18px 20px;}
.approval-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
.approval-flag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:#c2410c;margin-bottom:6px;}
.approval-flag svg{width:13px;height:13px;stroke:#c2410c;}
.approval-title{margin:0;font-size:14.5px;font-weight:800;color:var(--text);text-transform:none;letter-spacing:0;}
.approval-sla{flex:0 0 auto;font-size:11.5px;font-weight:700;color:#c2410c;background:#fff;border:1px solid #fed7aa;border-radius:999px;padding:5px 12px;white-space:nowrap;}
.approval-amounts{display:flex;flex-wrap:wrap;gap:28px;margin-bottom:16px;}
.approval-amounts .amt-block{min-width:90px;}
.approval-amounts .amt-wide{min-width:180px;}
.approval-amounts .ai{font-size:10.5px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
.approval-amounts .av{font-size:14.5px;font-weight:800;margin-top:3px;color:var(--text);}
.approval-amounts .av-lg{font-size:21px;color:#c2410c;}
.approval-amounts .av-sm{font-size:12px;font-weight:700;}
.approval-grounds{margin-bottom:14px;}
.approval-grounds .ai{font-size:10.5px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
.approval-grounds p{font-size:13px;color:#4b5563;margin:0;line-height:1.5;}
.approval-decline{max-height:0;overflow:hidden;opacity:0;margin-bottom:0;transition:max-height .2s ease,opacity .2s ease,margin-bottom .2s ease;}
.approval-decline.open{max-height:220px;opacity:1;margin-bottom:14px;}
.approval-decline label{display:block;font-size:12px;font-weight:700;color:var(--text-dim);margin-bottom:2px;}
.approval-decline label .opt{font-weight:500;color:var(--text-faint);}
.approval-decline textarea{margin-top:0;}

/* order accordion (User & order section) */
.order-accordion{margin-top:14px;display:flex;flex-direction:column;gap:8px;}
.order-item{border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.order-item summary{list-style:none;display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;background:#fafbfc;}
.order-item summary::-webkit-details-marker{display:none;}
.order-item[open] summary{border-bottom:1px solid var(--border-soft);}
.order-item.order-linked summary{background:var(--accent-soft);}
.order-summary-id{font-size:12.5px;font-weight:700;color:var(--text);}
.order-summary-type{font-size:12.5px;color:var(--text-dim);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.order-summary-amt{font-size:12.5px;font-weight:700;color:var(--text);}
.order-caret{color:var(--text-faint);flex:0 0 auto;display:flex;transition:transform .15s;}
.order-caret svg{width:14px;height:14px;}
.order-item[open] .order-caret{transform:rotate(180deg);}
.order-item-body{padding:14px;}
.order-item-body.kv{grid-template-columns:110px 1fr;}

/* user details + previous-notes card side by side */
.user-detail-row{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;}
.user-detail-row .kv{flex:1;min-width:220px;}
.user-notes-card{flex:0 0 280px;min-width:220px;background:#fafbfc;border:1px solid var(--border);border-radius:10px;padding:13px 15px;}
.user-notes-card .unc-label{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--text-faint);margin-bottom:8px;}
.user-notes-card .unc-item{font-size:12.5px;padding:8px 0;border-top:1px solid var(--border-soft);}
.user-notes-card .unc-item:first-child{padding-top:0;border-top:none;}

/* conversation / chat — styled after the DoubleTick WhatsApp chat UI reference */
.chat-panel{background:#efeae2;border:1px solid var(--border);border-radius:12px;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
.chat-head{background:#fff;border-bottom:1px solid var(--border);padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex:0 0 auto;}
.chat-head-id{display:flex;align-items:center;gap:10px;min-width:0;}
.chat-avatar{position:relative;width:36px;height:36px;border-radius:50%;background:var(--indigo-bg);color:var(--indigo-text);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;flex:0 0 36px;}
.chat-avatar .wa-badge{position:absolute;bottom:-2px;right:-2px;width:15px;height:15px;border-radius:50%;background:var(--wa-text);border:2px solid #fff;display:flex;align-items:center;justify-content:center;}
.chat-avatar .wa-badge svg{width:9px;height:9px;stroke:#fff;}
.chat-head-meta{min-width:0;}
.chat-head-name{font-size:13.5px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-head-sub{font-size:11px;color:var(--text-faint);margin-top:1px;}
.chat-head-agent{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#374151;background:#f5f6f8;border:1px solid var(--border);border-radius:999px;padding:6px 11px;white-space:nowrap;flex:0 0 auto;}
.chat-head-agent .caret{color:var(--text-faint);font-size:10px;}
.chat-thread{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
.chat-row{display:flex;flex-direction:column;max-width:80%;}
.chat-row.from-user{align-self:flex-start;align-items:flex-start;}
.chat-row.from-agent{align-self:flex-end;align-items:flex-end;}
.chat-row.from-human{align-self:flex-end;align-items:flex-end;}
.chat-sender{font-size:11px;font-weight:800;margin-bottom:3px;padding:0 3px;}
.chat-row.from-agent .chat-sender{color:var(--wa-text);}
.chat-row.from-human .chat-sender{color:#1e3a8a;}
.chat-bubble{position:relative;border-radius:9px;padding:8px 12px 6px;font-size:13.5px;line-height:1.45;box-shadow:0 1px 1px rgba(0,0,0,.06);}
.chat-row.from-user .chat-bubble{background:#fff;border-top-left-radius:2px;}
.chat-row.from-agent .chat-bubble{background:var(--wa-bg);border-top-right-radius:2px;color:#0a3d1e;}
.chat-row.from-human .chat-bubble{background:#eaf0ff;border-top-right-radius:2px;color:#1e3a8a;}
.chat-translation{font-size:12px;font-style:italic;color:var(--text-faint);margin-top:4px;padding:0 4px;}
.chat-time{display:block;text-align:right;font-size:10px;color:var(--text-faint);margin-top:3px;}
.chat-system{align-self:center;font-size:11.5px;font-weight:600;color:#5f6b6d;background:#fff;border-radius:8px;padding:6px 14px;box-shadow:0 1px 1px rgba(0,0,0,.05);text-align:center;max-width:88%;}
.chat-compose{flex:0 0 auto;background:#fff;border-top:1px solid var(--border);padding:9px 12px;display:flex;align-items:center;gap:10px;}
.chat-compose .compose-ic{color:var(--text-faint);flex:0 0 auto;display:flex;}
.chat-compose .compose-input{flex:1;min-width:0;font-size:13px;color:var(--text-faint);background:#f5f6f8;border-radius:20px;padding:9px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-compose .compose-send{width:34px;height:34px;border-radius:50%;background:var(--wa-text);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 34px;border:none;opacity:.55;cursor:not-allowed;}
.chat-compose .compose-send svg{width:15px;height:15px;stroke:#fff;}

/* decision log */
.decision-item{border-left:3px solid var(--accent-soft);padding:8px 0 8px 14px;margin-bottom:2px;}
.decision-item .dtop{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.decision-item .drule{font-weight:700;font-size:12.5px;color:var(--accent-dark);}
.decision-item .dtime{font-size:11px;color:var(--text-faint);}
.decision-item .dtext{font-size:12.5px;color:#374151;margin-top:3px;line-height:1.5;}
.decision-item .dgrounds{font-size:11px;color:var(--text-faint);margin-top:3px;}

/* audit trail row (matches existing CC format: icon + action + status pill + actor + timestamp) */
.audit-row{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-bottom:1px solid var(--border-soft);}
.audit-row:last-child{border-bottom:none;}
.audit-ic{width:30px;height:30px;border-radius:8px;background:#f1f2f4;display:flex;align-items:center;justify-content:center;flex:0 0 30px;color:#374151;}
.audit-ic svg{width:15px;height:15px;}
.audit-ic.actor-ai{background:var(--indigo-bg);color:var(--indigo-text);}
.audit-ic.actor-system{background:var(--slate-bg);color:var(--slate-text);}
.audit-ic.actor-user{background:var(--blue-bg);color:var(--blue-text);}
.audit-ic.actor-supply{background:var(--amber-bg);color:var(--amber-text);}
.audit-main{flex:1;min-width:0;}
.audit-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.audit-action{font-size:13px;font-weight:700;color:var(--text);}
.audit-actor{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:#eef0f3;color:#4b5563;}
.audit-actor.actor-ai{background:var(--indigo-bg);color:var(--indigo-text);}
.audit-why{font-size:11.5px;color:var(--text-dim);margin-top:3px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#fafbfc;border:1px solid var(--border-soft);border-radius:6px;padding:5px 8px;}
.audit-time{font-size:11.5px;color:var(--text-faint);white-space:nowrap;margin-left:auto;}

/* AI Control */
.gauge-wrap{margin-top:6px;}
.gauge-track{height:9px;border-radius:99px;background:#eef0f3;overflow:hidden;}
.gauge-fill{height:100%;border-radius:99px;background:var(--accent);}
.gauge-fill.danger{background:var(--red-text);}
.gauge-label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-dim);margin-top:5px;}
.breaker-banner{display:flex;align-items:flex-start;gap:10px;background:var(--red-bg);border:1px solid var(--red-border);color:var(--text);border-radius:10px;padding:12px 14px;font-size:12.5px;line-height:1.5;margin-bottom:14px;}
.breaker-banner svg{width:17px;height:17px;stroke:var(--red-text);flex-shrink:0;margin-top:1px;}
.breaker-banner b{color:var(--red-text);}
.rule-family{margin-bottom:6px;}
.rule-family-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--text-faint);margin:22px 0 4px;}
.rule-family-title:first-child{margin-top:0;}
.threshold-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--border-soft);flex-wrap:wrap;}
.threshold-row:last-child{border-bottom:none;}
.threshold-label{font-weight:600;font-size:13px;}
.threshold-sub{color:var(--text-faint);font-size:11.5px;margin-top:2px;}
.threshold-control{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
.threshold-row.editing{background:var(--accent-soft);margin:0 -14px;padding:12px 14px;border-radius:10px;border-bottom-color:transparent;}
.threshold-edit{display:flex;align-items:center;gap:6px;}
.threshold-affix{font-weight:700;font-size:13px;color:var(--text-dim);white-space:nowrap;}
.threshold-input{width:84px;border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:13px;font-family:inherit;font-weight:700;}
.threshold-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(230,126,73,.18);}
.history-table td, .history-table th{font-size:12.5px;}
.history-old{color:var(--text-faint);text-decoration:line-through;}
.history-new{color:var(--text);font-weight:700;}

/* knowledge doc */
.kb-editor{width:100%;min-height:360px;border:1px solid var(--border);border-radius:12px;padding:16px 18px;font-family:'Inter',sans-serif;font-size:13.5px;line-height:1.7;resize:vertical;}
.kb-version-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--border-soft);}
.kb-version-row:last-child{border-bottom:none;}

/* ---- dev annotations overlay (handoff mode) ---- */
.annot-bar{position:fixed;right:24px;bottom:24px;z-index:500;display:flex;align-items:center;gap:10px;background:#6d28d9;color:#fff;border-radius:999px;padding:10px 14px;box-shadow:0 6px 18px rgba(109,40,217,.35);font-family:inherit;}
.annot-switch{width:34px;height:20px;border-radius:999px;background:rgba(255,255,255,.32);position:relative;cursor:pointer;flex:0 0 34px;transition:background .15s;}
.annot-switch .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;}
.annot-switch.on{background:#fff;}
.annot-switch.on .knob{left:16px;background:#6d28d9;}
.annot-bar-label{font-size:13.5px;font-weight:700;cursor:pointer;user-select:none;white-space:nowrap;}
.annot-expand-btn{display:flex;align-items:center;justify-content:center;flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:none;background:rgba(255,255,255,.2);color:#fff;cursor:pointer;padding:0;margin-left:2px;}
.annot-expand-btn:hover{background:rgba(255,255,255,.32);}
.annot-expand-btn svg{width:13px;height:13px;transition:transform .15s;}
.annot-expand-btn.open svg{transform:rotate(180deg);}
.annot-panel{position:fixed;right:24px;bottom:76px;z-index:490;width:290px;max-height:min(380px,55vh);overflow-y:auto;background:#fff;border-radius:14px;box-shadow:0 12px 32px rgba(16,24,40,.22);padding:14px;}
.annot-panel h4{margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:.5px;color:#6d28d9;text-transform:uppercase;}
.annot-item{display:flex;gap:10px;align-items:flex-start;padding:7px 6px;border-radius:8px;cursor:pointer;}
.annot-item:hover{background:#f7f4fe;}
.annot-item .num{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:#6d28d9;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.annot-item .lbl{font-size:12.5px;color:#374151;line-height:1.4;}
.annot-pin{position:fixed;z-index:485;width:26px;height:26px;border-radius:50%;background:#6d28d9;color:#fff;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;cursor:pointer;transition:transform .12s;}
.annot-pin:hover{transform:scale(1.14);}
.annot-pin.active{background:#5b21b6;box-shadow:0 0 0 4px rgba(109,40,217,.28),0 2px 8px rgba(0,0,0,.3);}
.annot-box{position:fixed;z-index:480;border:2px dashed #7c3aed;border-radius:12px;pointer-events:none;}
.annot-card{position:fixed;z-index:495;width:300px;background:#fff;border-radius:14px;box-shadow:0 14px 36px rgba(16,24,40,.25);padding:18px 18px 16px;}
.annot-card .annot-close{position:absolute;top:12px;right:12px;border:none;background:transparent;cursor:pointer;color:#9aa0aa;padding:2px;line-height:0;}
.annot-card .annot-close svg{width:14px;height:14px;}
.annot-card .annot-tag{display:inline-block;background:#efe6fd;color:#6d28d9;font-size:10.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;padding:3px 10px;border-radius:999px;margin-bottom:10px;}
.annot-card .annot-title{font-size:14.5px;font-weight:800;margin:0 0 10px;color:#1f2430;padding-right:18px;line-height:1.35;}
.annot-card .annot-note{font-size:13px;font-style:italic;color:#3f3f46;line-height:1.5;margin:0 0 10px;padding-left:10px;border-left:3px solid #e4d9fb;}
.annot-card .annot-call{font-size:12.5px;color:#52525b;line-height:1.5;margin:0;}
</style>

<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-col">

      <div class="avatar" id="avatar"></div>
    </div>
    <div class="page-wrap">
      <div class="crumbs-row">
        <div class="hamburger" id="hamburger" onclick="toggleSidebar()"></div>
        <div class="crumbs" id="crumbs"></div>
      </div>
      <div id="view-root"></div>
    </div>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>/* ============================================================
   AI Customer Support — Phase 0-3 clickable prototype (CC surfaces)
   Vanilla JS, mock data only, hash-based router.
   Visual system matches the AQE Phase-1 CC prototype (same tokens/components)
   so this reads as the same Control Center, not a separate app.
   ============================================================ */

const NOW = new Date('2026-08-18T15:20:00+05:30'); // fixed "now" for this prototype's fictional timeline

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }
function toast(msg){
  const root = document.getElementById('toast-root');
  const t = document.createElement('div');
  t.className='toast';
  t.textContent = msg;
  root.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 3200);
}
function openModal(html, wide){
  document.getElementById('modal-root').innerHTML =
    '<div class="modal-backdrop" onclick="if(event.target===this) closeModal()">'+
      '<div class="modal-box'+(wide?' wide':'')+'" style="position:relative;">'+
        '<button class="x-btn" style="position:absolute;top:20px;right:20px;" onclick="closeModal()">&times;</button>'+
        html+
      '</div>'+
    '</div>';
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }
function dateLabel(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) + ' · ' + d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}
function ageLabel(iso){
  const then = new Date(iso);
  const ms = NOW-then;
  const days = Math.floor(ms/86400000);
  const hrs = Math.floor((ms%86400000)/3600000);
  const mins = Math.floor((ms%3600000)/60000);
  if(days>0) return days+'d '+hrs+'h ago';
  if(hrs>0) return hrs+'h '+mins+'m ago';
  return mins+'m ago';
}

const RULES = {
  1:{family:'Family 1 — Segmentation', title:'User segments', text:'Whale (>₹1,000 spent in 90 days), Repeat (2+ paid orders lifetime), New (0-1 paid orders), Flagged (fraud/abuse marker, overrides all). Segment decides only how much goodwill money the AI may spend — speed, tone and the right to escalate are identical for everyone.'},
  2:{family:'Family 2 — Money', title:'SLA-breach refund', text:'A refund triggers only on a real SLA breach, never on a user’s claim alone. Inside the grace window: honest status + a concrete ETA, no refund talk. Beyond grace: full refund first, then the apology coupon (Whale ₹200 / Repeat ₹100 / New ₹50), both in the same message. The AI acts alone up to ₹500; above that, nothing goes out until a human approves, same working day.'},
  3:{family:'Family 2 — Money', title:'Refund request on a fulfilled order', text:'No AI cash unless AQE confirms an objective defect. AQE clean + New → no coupon, factual reply. AQE clean + Repeat/Whale → goodwill coupon. AQE defect + Repeat/Whale → full refund + coupon. AQE defect + New → coupon + redo, cash stays human-gated. AQE grade missing → treat as clean for Repeat/Whale, escalate for New.'},
  4:{family:'Family 2 — Money', title:'Deliverable access', text:'Deliverables never travel over WhatsApp. The agent always answers with a deeplink into the app. If access keeps failing, or the same artefact is asked for more than 3 times in a week, a human takes over — they fix access too, they don’t send the file either. If the artefact was never generated, that’s not an access problem: a Support Case goes to a human who chases supply.'},
  5:{family:'Family 2 — Money', title:'Defect remediation (redo or fix)', text:'Our fault, zero cost → free instant redo, any segment. Our fault, real cost → free redo + apology coupon. User-caused, zero cost → free regeneration. User-caused, real cost → free for Whales only (once/30 days); everyone else gets a paid-redo path, no coupon. The AI never edits orders a person performs — only machine-generated deliverables.'},
  6:{family:'Family 2 — Money', title:'Payment failures & double debits', text:'Always verified against Razorpay, never a screenshot. Confirmed anomaly → instant refund, no cap, plus the bank’s ARN tracking reference. No record found → explain what our records show, ask for the transaction reference, retry once, then hand to a human tagged payment-dispute.'},
  7:{family:'Family 2 — Money', title:'Per-user velocity caps', text:'At most 2 auto-refunds and 3 coupons per user per rolling 90 days (Rule 6 refunds exempt — that’s the user’s own money). Past the cap, money decisions route to a human silently — the user is never told a cap exists. Hitting caps twice in 180 days auto-flags the user.'},
  8:{family:'Family 2 — Money', title:'Global circuit breakers', text:'Daily ceiling: ₹5,000 of AI-issued money per day (Rule 6 excluded). Anomaly breaker: issuance in any hour exceeding 3× the trailing 7-day baseline. Either one fires → the AI stops issuing refunds/coupons, pending decisions queue for humans, and #sla-alerts fires. Only a human resumes — never a timer.'},
  9:{family:'Family 3 — Actions', title:'No AI cancellations', text:'The AI never cancels an order — Prashna allocates instantly by code, so there’s no safe "nothing has happened yet" window. It explains work has begun and shows status. Exceptional grounds (accidental order, duplicate order) go to a human.'},
  10:{family:'Family 3 — Actions', title:'No-shows & last-minute reschedules', text:'We no-showed → auto-reschedule + apology coupon. User no-showed → the ~80% discount rebook coupon on complaint, evidence shown kindly, no free pass. Genuine extenuating claims → human via the grief trigger. Last-minute reschedule (<15 min before slot) granted once per order; second ask → human.'},
  11:{family:'Family 4 — Escalation', title:'Hard escalation triggers', text:'Immediate handoff, no self-attempt: (1) user asks for a human, (2) legal/chargeback/consumer-forum/social threat, (3) grief-sensitive context + complaint, (4) self-harm or distress signal — helpline first, always, (5) conduct complaint about a named practitioner, (6) third contact on the same issue within 48h, (7) intent still unclear after two clarifying attempts.'},
  12:{family:'Family 5 — Sanctity', title:'No astro answers, warm redirect', text:'The support AI never answers an astrology question, however small. It acknowledges warmly and deeplinks to the right paid SKU. It may quote a delivered report verbatim but never interprets or extends it.'},
  13:{family:'Family 5 — Sanctity', title:'Approved knowledge only', text:'Ritual, tradition and policy content is answered only from the approved Support Knowledge document, snapshotted on every save — never the agent’s own improvisation. If the document doesn’t cover it, the AI says so honestly and escalates.'},
  14:{family:'Family 5 — Sanctity', title:'Everything on the record', text:'Every AI action with a side effect — refund, coupon, detail change, case opened/closed, escalation — lands in the order’s Audit Trail, with the AI as a fourth actor type. Money actions additionally log which rule fired, the segment, the AQE grade, and the cap state at decision time.'},
};
function ruleChip(num){
  if(!num) return '';
  const r = RULES[num]; if(!r) return '';
  return '<span class="rule-chip" onclick="event.stopPropagation();openRuleModal('+num+')">'+ICONS.book+' Rule '+num+' &middot; '+esc(r.title)+'</span>';
}
/* Compact variant for tight spaces (e.g. the queue table's Reason column) —
   just "Rule N", with the full title + text as a native hover tooltip rather
   than printed inline. */
function ruleChipCompact(num){
  if(!num) return '';
  const r = RULES[num]; if(!r) return '';
  return '<span class="rule-chip rule-chip-sm" onclick="event.stopPropagation();openRuleModal('+num+')" data-tooltip="'+esc(r.title)+'">Rule '+num+'</span>';
}
function openRuleModal(highlightNum){
  const groups = {};
  Object.keys(RULES).forEach(k=>{ const r=RULES[k]; (groups[r.family]=groups[r.family]||[]).push({num:k,...r}); });
  let body = '<h2>Guardrail rule reference</h2><p class="page-sub" style="margin-bottom:16px;">Annex A, v1 &middot; the policy layer enforces these in code. Thresholds are editable in AI Control without a deploy.</p>';
  Object.keys(groups).forEach(fam=>{
    body += '<div class="rubric-dim" style="margin-top:18px;"><h4 style="text-transform:none;letter-spacing:0;color:var(--teal);font-size:13px;">'+esc(fam)+'</h4>';
    groups[fam].forEach(r=>{
      const hl = String(r.num)===String(highlightNum);
      body += '<div style="padding:11px 13px;border-radius:10px;margin-bottom:6px;'+(hl?'background:var(--accent-soft);border:1px solid var(--accent-muted);':'background:#fafbfc;border:1px solid var(--border-soft);')+'">'+
        '<div style="font-weight:800;font-size:12.5px;color:'+(hl?'var(--accent-dark)':'var(--text)')+';margin-bottom:3px;">Rule '+r.num+' &middot; '+esc(r.title)+'</div>'+
        '<div style="font-size:12.5px;color:#4b5563;line-height:1.55;">'+esc(r.text)+'</div>'+
      '</div>';
    });
    body += '</div>';
  });
  openModal(body, true);
  if(highlightNum) setTimeout(()=>{ const el=document.querySelector('.modal-box'); if(el) el.scrollTop=0; },0);
}

const GENERIC_DETAIL_CACHE = {};
function getCaseDetail(id){

  if(GENERIC_DETAIL_CACHE[id]) return GENERIC_DETAIL_CACHE[id];
  const c = caseById(id);
  if(!c) return null;
  const d = {
    conversation:[
      {from:'user', time:dateLabel(c.openedAt).split('&middot;')[1]||'', text:'('+esc(c.reason)+')'},
      {from:'agent', time:'', text:'I want to make sure this is handled properly — connecting you with my team on this one.'},
      {from:'system', time:'', text:'Rule '+c.ruleNum+' fired: '+ (RULES[c.ruleNum]?RULES[c.ruleNum].title:'')+'.'},
    ],
    decisionLog:[
      {ruleNum:c.ruleNum, action:c.reason, grounds:'See Rule '+c.ruleNum+' for the full policy.', time:''},
    ],
    auditTrail:[
      {actor:'ai', action:'Support Case '+c.id+' opened — '+RULE_TAG_LABEL[c.ruleTag], time:dateLabel(c.openedAt)},
    ],
    notes:[],
  };
  GENERIC_DETAIL_CACHE[id] = d;
  return d;
}
function addCaseNote(id){
  const ta = document.getElementById('note-input');
  if(!ta || !ta.value.trim()) { toast('Write a note first.'); return; }
  const d = getCaseDetail(id);
  d.notes.push({author:'You', time:new Date().toISOString(), text:ta.value.trim()});
  toast('Note saved to the order’s Notes field.');
  render();
}
function reassignCase(id, sel){
  const c = caseById(id);
  c.owner = sel.value==='__unassigned' ? null : sel.value;
  // A case only moves between "Needs human" and "In progress" on assignment —
  // other states (AI watching, Needs approval, Resolved) aren't about human
  // ownership and shouldn't be touched by reassigning who's on it.
  if(c.state==='needs_human' || c.state==='in_progress'){
    c.state = (c.owner && c.owner!=='AI') ? 'in_progress' : 'needs_human';
  }
  toast(c.owner ? 'Case reassigned to '+c.owner+'.' : 'Case unassigned.');
  render();
}
function resolveCase(id){
  const c = caseById(id);
  c.state = 'resolved';
  c.resolvedAt = new Date().toISOString();
  const d = getCaseDetail(id);
  d.auditTrail.push({actor:'human', action:'Case resolved', statusText:'Resolved', time:'just now'});
  toast('Case resolved — written to the order’s Audit Trail.');
  nav('support/cases');
}
function reopenCase(id){
  const c = caseById(id);
  const d = getCaseDetail(id);
  // Reopening picks up wherever ownership already stands: a named human owner
  // means the case is actively being worked (In progress); no owner means it
  // goes back to the general Needs human queue.
  c.state = (c.owner && c.owner!=='AI') ? 'in_progress' : 'needs_human';
  delete c.resolvedAt;
  d.auditTrail.push({actor:'human', action:'Case reopened — marked resolved by mistake', statusText:'Reopened', time:'just now'});
  toast('Case reopened — back in the queue.');
  render();
}

function declineRefund(id){

  const c = caseById(id); const d = getCaseDetail(id);

function revealDeclineField(id){
  const wrap = document.getElementById('decline-wrap-'+id);
  const btn = document.getElementById('decline-btn-'+id);
  const approveBtn = document.getElementById('approve-btn-'+id);
  if(!wrap || !btn) return;
  if(!wrap.classList.contains('open')){
    wrap.classList.add('open');
    btn.disabled = true;
    btn.onclick = function(){ declineRefund(id); };
    if(approveBtn){
      approveBtn.innerHTML = ICONS.back+' Back';
      approveBtn.onclick = function(){ collapseDeclineField(id); };
    }
    const ta = document.getElementById('decline-instruction');
    if(ta) ta.focus();
  }
}
function collapseDeclineField(id){
  const wrap = document.getElementById('decline-wrap-'+id);
  const btn = document.getElementById('decline-btn-'+id);
  const approveBtn = document.getElementById('approve-btn-'+id);
  const ta = document.getElementById('decline-instruction');
  if(wrap) wrap.classList.remove('open');
  if(ta) ta.value = '';
  if(btn){
    btn.disabled = false;
    btn.onclick = function(){ revealDeclineField(id); };
  }
  if(approveBtn){
    approveBtn.innerHTML = ICONS.check+' Approve';
    approveBtn.onclick = function(){ approveRefund(id); };
  }
}
function onDeclineInput(id){
  const ta = document.getElementById('decline-instruction');
  const btn = document.getElementById('decline-btn-'+id);
  if(ta && btn) btn.disabled = ta.value.trim().length === 0;
}

const DEFAULT_QFILTER = {q:'', state:'all', reason:'all', owner:'all', segment:'all', sort:'recent', dateFrom:'', dateTo:''};
let qFilter = Object.assign({}, DEFAULT_QFILTER);

let dateRangeOpen = false;

let qPage = 1;
function orderAmountFor(c){
  // Table/detail "Amount" should reflect the linked order's real value, so it
  // always matches whatever a refund/approval on that same case refers to.
  if(!c.orderId) return null;
  const u = USERS[c.userId];
  const o = u && u.orders.find(o=>o.id===c.orderId);
  return o ? o.amount : null;
}
function sortCases(list){
  if(qFilter.sort==='urgency'){
    // Most urgent first: open states that need a person before ones that don't,
    // unassigned before assigned within the same state, and — as a tiebreaker —
    // the case that's been sitting the longest, since that's the one most overdue.
    const rank = {needs_human:0, in_progress:1, needs_approval:2, waiting_on_user:3, ai_watching:4, resolved:5};
    return list.slice().sort((a,b)=>{
      const ra = rank[a.state]!==undefined?rank[a.state]:5, rb = rank[b.state]!==undefined?rank[b.state]:5;
      if(ra!==rb) return ra-rb;
      const ua = a.owner?1:0, ub = b.owner?1:0;
      if(ua!==ub) return ua-ub;
      return new Date(a.openedAt)-new Date(b.openedAt);
    });
  }
  return list.slice().sort((a,b)=> new Date(b.openedAt)-new Date(a.openedAt));
}
function filteredCases(){
  return sortCases(CASES.filter(c=>{
    if(qFilter.state!=='all' && c.state!==qFilter.state) return false;
    if(qFilter.reason!=='all' && c.ruleTag!==qFilter.reason) return false;
    if(qFilter.owner!=='all'){
      if(qFilter.owner==='__ai' && c.owner!=='AI') return false;
      if(qFilter.owner==='__unassigned' && c.owner!==null) return false;
      if(qFilter.owner!=='__ai' && qFilter.owner!=='__unassigned' && c.owner!==qFilter.owner) return false;
    }
    if(qFilter.segment!=='all'){
      const u = USERS[c.userId];
      if(!u || effectiveSegment(u)!==qFilter.segment) return false;
    }
    if(qFilter.q){
      const u = USERS[c.userId];
      const hay = (c.id+' '+(c.orderId||'')+' '+(u?u.name:'')).toLowerCase();
      if(!hay.includes(qFilter.q.toLowerCase())) return false;
    }
    if(qFilter.dateFrom){
      if(new Date(c.openedAt) < new Date(qFilter.dateFrom+'T00:00:00')) return false;
    }
    if(qFilter.dateTo){
      if(new Date(c.openedAt) > new Date(qFilter.dateTo+'T23:59:59')) return false;
    }
    return true;
  }));
}
function dateRangeLabel(){
  const from = qFilter.dateFrom, to = qFilter.dateTo;

  if(from && to) return short(from)+' – '+short(to);
  if(from) return 'From '+short(from);
  if(to) return 'Until '+short(to);
  return 'Select date range';
}

function actorLabel(actor){ return {ai:'AI', system:'System', user:'User', supply:'Supply', human:'Human'}[actor]||'Human'; }
function chatHtml(conv, c, u){
  // Visually replicates the DoubleTick WhatsApp chat UI (avatar+name+WhatsApp badge
  // header, agent-assigned badge, cream thread, white/mint bubbles, centered system
  // pills) per the reference screenshots. Per PRD Req 3 the CC conversation view is
  // read-only, so the compose bar is a faithful-looking but disabled/non-functional
  // affordance, not a real reply box — a small note underneath makes that explicit.
  const initials = (u && u.name ? u.name.split(' ').map(w=>w[0]).slice(0,2).join('') : '?').toUpperCase();
  const thread = conv.map(m=>{
    if(m.from==='system') return '<div class="chat-system">'+esc(m.text)+'</div>';
    if(m.from==='human') return '<div class="chat-row from-human"><div class="chat-sender">'+esc(c.owner||'Human agent')+'</div><div class="chat-bubble">'+esc(m.text)+(m.time?'<span class="chat-time">'+esc(m.time)+'</span>':'')+'</div></div>';
    const cls = m.from==='agent' ? 'from-agent' : 'from-user';
    return '<div class="chat-row '+cls+'">'+
      (m.from==='agent'?'<div class="chat-sender">Dharmayana AI Agent</div>':'')+
      '<div class="chat-bubble">'+esc(m.text)+
      (m.translation?'<div class="chat-translation">EN: '+esc(m.translation)+'</div>':'')+
      (m.time?'<span class="chat-time">'+esc(m.time)+'</span>':'')+
      '</div></div>';
  }).join('');
  return '<div class="chat-panel">'+
    '<div class="chat-head">'+
      '<div class="chat-head-id">'+
        '<div class="chat-avatar">'+esc(initials)+'<span class="wa-badge">'+ICONS.chat+'</span></div>'+
        '<div class="chat-head-meta"><div class="chat-head-name">'+esc(u?u.name:'Unknown user')+'</div><div class="chat-head-sub">WhatsApp'+(u&&u.phone?' &middot; '+esc(u.phone):'')+'</div></div>'+
      '</div>'+
    '</div>'+
    '<div class="chat-thread">'+thread+'</div>'+
    '<div class="chat-compose" aria-disabled="true">'+
      '<span class="compose-ic" title="Improve writing (DoubleTick only)">'+ICONS.wand+'</span>'+
      '<div class="compose-input">Reply from DoubleTick — read-only here</div>'+
      '<span class="compose-ic" title="Attach (DoubleTick only)">'+ICONS.paperclip+'</span>'+
      '<button class="compose-send" disabled title="Read-only in the Control Center">'+ICONS.send+'</button>'+
    '</div>'+
  '</div>';
}
function decisionLogHtml(log){

    const r = RULES[l.ruleNum];

      '<div class="dtext">'+esc(l.action)+'</div>'+

function auditTrailHtml(trail){

    return '<div class="audit-row">'+actorIcon(a.actor)+
      '<div class="audit-main"><div class="audit-top"><span class="audit-action">'+esc(a.action)+'</span>'+
      '<span class="audit-actor'+(a.actor==='ai'?' actor-ai':'')+'">'+esc(actorLabel(a.actor))+'</span>'+

}

  return html;

function gaugeHtml(label, used, total, unit){
  const pct = Math.min(100, Math.round(used/total*100));
  const danger = pct>=90;
  const fmt = v => unit==='₹' ? (unit+v) : (v+unit);
  return '<div class="gauge-wrap"><div class="gauge-label"><span>'+esc(label)+'</span><span>'+fmt(used)+' of '+fmt(total)+'</span></div>'+
    '<div class="gauge-track"><div class="gauge-fill'+(danger?' danger':'')+'" style="width:'+pct+'%;"></div></div></div>';
}
function thresholdRow(label, sub, key, val, prefix, suffix, annotKey){
  prefix = prefix||''; suffix = suffix||'';
  const isEditing = editingThreshold === key;
  const labelEsc = esc(label).replace(/'/g,"\\'");
  let control;
  if(isEditing){
    control = '<div class="threshold-edit">'+
      (prefix?'<span class="threshold-affix">'+esc(prefix)+'</span>':'')+
      '<input type="number" class="threshold-input" id="th-input-'+key+'" value="'+esc(String(val))+'" onkeydown="if(event.key===\'Enter\'){saveThreshold(\''+key+'\',\''+labelEsc+'\');}else if(event.key===\'Escape\'){cancelEditThreshold();}">'+
      (suffix?'<span class="threshold-affix">'+esc(suffix)+'</span>':'')+
      '<button class="btn btn-solid btn-sm" onclick="saveThreshold(\''+key+'\',\''+labelEsc+'\')">Save</button>'+
      '<button class="btn btn-ghost btn-sm" onclick="cancelEditThreshold()">Cancel</button>'+
    '</div>';
  } else {
    control = '<span class="mono" style="font-weight:800;font-size:14px;">'+esc(prefix+val+suffix)+'</span>'+
      '<button class="btn btn-ghost btn-sm" onclick="startEditThreshold(\''+key+'\')">Edit</button>';
  }
  return '<div class="threshold-row'+(isEditing?' editing':'')+'"'+(annotKey?' data-annot="'+annotKey+'"':'')+'><div><div class="threshold-label">'+esc(label)+'</div>'+(sub?'<div class="threshold-sub">'+esc(sub)+'</div>':'')+'</div>'+
    '<div class="threshold-control">'+control+'</div></div>';
}

    {sel:'[onclick^="toggleUserFlag"]', tag:'Data contract', title:'Flag and Notes are two different data models — don\'t merge them',
      note:'Flag is a structured boolean on the user (flagged) that overrides segment logic everywhere the AI checks it; Notes are free-text and narrative-only, with no effect on policy.',
      call:'Design call: it\'s easy to conflate "leave a warning note" with "flag this user." Keep flagging as its own explicit action/field in the real data model — the AI should never be expected to parse a note to detect one.'},
    {sel:'.case-assign-box select', tag:'Business rule', title:'"AI" is offered as an assignee on every case — the ownership model may not support that',
      note:'Req 14 says the AI only ever owns system-event-watch cases (ai_watching / needs_approval) — this dropdown currently lets a Needs-human or In-progress case be reassigned back to "AI" too.',
      call:'Design call: flagged to the user, not yet resolved. Before wiring real reassignment, confirm whether a human should be able to hand a case back to the AI outside those two states, or whether this option should be conditionally hidden.'},
    {sel:'.approval-card', tag:'Business rule', title:'Approve fires the refund and the held coupon together, as one action',
      note:'This panel only renders when a case both needsApproval and is in the needs_approval state — above the AI\'s own ₹500 auto-refund limit.',
      call:'Design call: per Req 18, approving must release the refund and the held coupon atomically in the real payment flow, not as two separate calls a human could interrupt between. The case is expected to close same working day once approved.'},
    {sel:'.chat-compose', tag:'Data contract', title:'This conversation view is read-only by design, not an unfinished feature',
      note:'The compose bar looks real (matches DoubleTick\'s own UI) but is deliberately disabled — replies happen only in DoubleTick itself.',
      call:'Design call: per Req 3, CC shows the conversation for context; it never becomes a second place to send messages from. "Open in DoubleTick" is the real reply path — don\'t wire this compose bar up to send anything without confirming that\'s an intentional scope change.'},
  ],
  aicontrol: [
    {sel:'.settings-row', tag:'Business rule', title:'Pausing here doesn\'t yet stop anything real',
      note:'Per Req 4, pausing should stop the agent from replying (conversations stay in the DoubleTick inbox for a human) and stop new Support Cases from being created for ordinary conversations — cases already open stay open and unaffected either way.',
      call:'Design call: this toggle only flips a boolean and shows a toast in the prototype. A real implementation needs to gate the actual message-handling pipeline on this flag, not just display its state.'},
    {sel:'[data-annot="ac-breaker-demo"]', tag:'Non-obvious default', title:'This button only exists for the demo',
      note:'"Simulate a ceiling breach" manually forces daily spend past the ceiling so the breaker-trip UI (banner, disabled toggle, history row) can be shown without a real event feed.',
      call:'Design call: remove this control once real spend/anomaly telemetry exists — Rule 8\'s breaker should trip itself off actual issuance data, never a manual button. Resuming afterward is already modeled correctly here: flipping the toggle back on is the same action a person would take for real.'},
    {sel:'.history-table', tag:'Business rule', title:'Change history should be a projection of an event log, not hand-typed per action',
      note:'Req 4 requires every threshold edit, pause, resume, and circuit-breaker trip to appear here with old value, new value, who, and when — as built, every control\'s own handler explicitly adds its own row.',
      call:'Design call: fine for a prototype; in the real service this table should read from an actual audit/event log keyed by the same fields, so a new kind of AI Control action can\'t accidentally forget to log itself the way pause/resume/the money toggle did until this was caught.'},
    {sel:'[data-annot="ac-payment-anomaly"]', tag:'Business rule', title:'Rule 6 refunds are exempt from the daily ceiling entirely',
      note:'Payment-anomaly refunds are the user\'s own money being returned, not AI goodwill spend — they\'re shown here for visibility only and never added into the ceiling gauge above.',
      call:'Design call: keep these as two genuinely separate counters server-side — folding them together would make the daily ceiling trip on legitimate refund volume it was never meant to cap.'},
    {sel:'[data-annot="ac-thresholds-live"]', tag:'Business rule', title:'Every value here takes effect immediately — no deploy',
      note:'That\'s explicit in Req 4 ("editable... takes effect without a deploy") — this prototype models it by mutating the threshold values directly and re-rendering.',
      call:'Design call: the real policy layer needs to hot-reload these values from wherever they\'re persisted (Req 12) rather than reading them from a config baked in at deploy time — that\'s the whole point of putting them here instead of in code.'},
    {sel:'[data-annot="ac-velocity"]', tag:'Business rule', title:'Hitting a velocity cap is silent to the user, by design',
      note:'Velocity caps are rolling 90-day per-user counters (Rule 7); once hit, money decisions route to a human without ever telling the user a cap exists.',
      call:'Design call: don\'t add user-facing copy anywhere that reveals cap logic ("you\'ve hit your refund limit") — Rule 7 is explicit that this stays invisible to the user. Hitting caps twice in 180 days should also auto-flag the user (see the Flag data contract on Case detail).'},
  ],
  knowledge: [
    {sel:'#kb-textarea', tag:'Business rule', title:'This document is knowledge the agent reads, never instructions it obeys',
      note:'Rules 12–13 and Req 15 are explicit: nothing written in here can grant a permission, change a guardrail, or alter escalation behavior — the agent may only quote/ground its ritual and policy answers from this text.',
      call:'Design call: this is a prompt-injection boundary as much as a content-policy one. Whatever service loads this document into the agent\'s context needs to treat it strictly as retrieved reference text, never as system/developer-level instructions, no matter what an edit here says.'},
    {sel:'[onclick^="restoreVersion"]', tag:'Non-obvious default', title:'"Restore" is a demo stub — it doesn\'t actually restore anything yet',
      note:'Clicking Restore here only shows a toast; the live document is left unchanged in this prototype.',
      call:'Design call: a real Restore should replace the live document with that version\'s content AND push a new version onto the top of history (a copy of the old one) — never delete or reorder the versions in between, so the full lineage stays intact. Same "never destroy prior state" principle as Case detail\'s verdict-reopen action.'},
    {sel:'.count', tag:'Data contract', title:'The version number shown is derived, not stored',
      note:'The "v14" badge is computed from a fixed base plus a count of versions with editor \'You\' every render — it isn\'t a field read off the document itself.',
      call:'Design call: once a real version history exists server-side, read the document\'s current version number directly from that record rather than recomputing it client-side — this was a shortcut for seeding mock data with a plausible starting version.'},
  ],
};

let annotationsOn = false;
let annotPanelOpen = true; // whether the "click to locate" list is expanded (marks/pins stay visible either way)
let activeAnnotKey = null; // "pageKey:index" of the open callout card, or null
function annotPageKey(){
  // Mirror render()'s own routing so annotations always match what's on screen.
  const h = location.hash || '#/support/cases';
  if(h.startsWith('#/support/cases')) return 'queue';
  if(h.startsWith('#/support/case/')) return 'case';
  if(h.startsWith('#/support/ai-control')) return 'aicontrol';
  if(h.startsWith('#/support/knowledge')) return 'knowledge';
  return null;
}
function toggleAnnotations(){
  annotationsOn = !annotationsOn;
  activeAnnotKey = null;
  refreshAnnotations();
}
function toggleAnnotPanel(){
  annotPanelOpen = !annotPanelOpen;
  refreshAnnotations();
}
function closeAnnotCallout(){ activeAnnotKey = null; refreshAnnotations(); }
function openAnnotCallout(key, doScroll){
  activeAnnotKey = key;
  const parts = key.split(':'); const pageKey = parts[0]; const idx = Number(parts[1]);
  const a = (ANNOTATIONS[pageKey]||[])[idx];
  if(doScroll && a){
    const el = document.querySelector(a.sel);
    if(el) el.scrollIntoView({block:'center', behavior:'smooth'});
  }
  refreshAnnotations();
}
function refreshAnnotations(){
  const root = document.getElementById('annot-root');
  if(!root) return;
  const pageKey = annotPageKey();
  const list = (pageKey && ANNOTATIONS[pageKey]) || [];

  const onscreenList = list.filter(a=>!!document.querySelector(a.sel));
  let html = '<div class="annot-bar">'+
    '<div class="annot-switch'+(annotationsOn?' on':'')+'" onclick="toggleAnnotations()" title="'+(annotationsOn?'Turn annotation marks off':'Turn annotation marks on')+'"><div class="knob"></div></div>'+
    '<span class="annot-bar-label" onclick="toggleAnnotations()">Annotations</span>'+
    (annotationsOn && onscreenList.length ? '<button class="annot-expand-btn'+(annotPanelOpen?' open':'')+'" onclick="toggleAnnotPanel()" title="'+(annotPanelOpen?'Collapse list':'Expand list')+'">'+ICONS.chevdown+'</button>' : '')+
  '</div>';
  if(annotationsOn && annotPanelOpen && onscreenList.length){
    html += '<div class="annot-panel"><h4>Annotations &middot; click to locate</h4>';
    list.forEach((a,idx)=>{
      const onscreen = !!document.querySelector(a.sel);
      if(!onscreen) return;
      html += '<div class="annot-item" onclick="openAnnotCallout(\''+pageKey+':'+idx+'\', true)">'+
        '<span class="num">'+(idx+1)+'</span><span class="lbl">'+esc(a.title)+'</span>'+
      '</div>';
    });
    html += '</div>';
  }
  root.innerHTML = html;

  if(!annotationsOn) return;
  list.forEach((a,idx)=>{
    const el = document.querySelector(a.sel);
    if(!el) return;
    const rect = el.getBoundingClientRect();
    const key = pageKey+':'+idx;

    const pin = document.createElement('div');
    pin.className = 'annot-pin'+(activeAnnotKey===key?' active':'');
    pin.textContent = String(idx+1);
    pin.style.left = (rect.right-10)+'px';
    pin.style.top = (rect.top-10)+'px';
    pin.onclick = function(){ openAnnotCallout(key, false); };
    root.appendChild(pin);

    if(activeAnnotKey===key){
      const box = document.createElement('div');
      box.className = 'annot-box';
      box.style.left = (rect.left-6)+'px';
      box.style.top = (rect.top-6)+'px';
      box.style.width = (rect.width+12)+'px';
      box.style.height = (rect.height+12)+'px';
      root.appendChild(box);

      const card = document.createElement('div');
      card.className = 'annot-card';
      let cardLeft = rect.right+16, cardTop = Math.max(12, rect.top-10);
      if(cardLeft+300 > window.innerWidth-12) cardLeft = Math.max(12, rect.left-316);
      if(cardTop+230 > window.innerHeight-12) cardTop = Math.max(12, window.innerHeight-242);
      card.style.left = cardLeft+'px';
      card.style.top = cardTop+'px';
      card.innerHTML = '<button class="annot-close" onclick="closeAnnotCallout()">'+ICONS.x+'</button>'+
        '<span class="annot-tag">'+esc(a.tag)+'</span>'+
        '<div class="annot-title">'+esc(a.title)+'</div>'+
        '<p class="annot-note">'+esc(a.note)+'</p>'+
        (a.call?'<p class="annot-call">'+esc(a.call)+'</p>':'');
      root.appendChild(card);
    }
  });
}
let annotScrollTicking = false;
window.addEventListener('scroll', function(){
  if(!annotationsOn) return;
  if(annotScrollTicking) return;
  annotScrollTicking = true;
  requestAnimationFrame(function(){ refreshAnnotations(); annotScrollTicking=false; });
}, true);
window.addEventListener('resize', function(){ if(annotationsOn) refreshAnnotations(); });
</script>
</body>
</html>
